apiVersion: v1
kind: Service
metadata:
  name: nederlands-tutor-service
  namespace: dutch-education
  labels:
    app: nederlands-tutor
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: nederlands-tutor
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nederlands-tutor-hpa
  namespace: dutch-education
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nederlands-tutor-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nederlands-tutor-config
  namespace: dutch-education
data:
  NODE_ENV: "production"
  PORT: "3000"
  POSTGRES_HOST: "postgres-ha.dutch-education.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "nederlands_tutordb"
  REDIS_HOST: "redis-ha.dutch-education.svc.cluster.local"
  REDIS_PORT: "6379"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nederlands-tutor-ingress
  namespace: dutch-education
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off" # For SSE streams
spec:
  tls:
    - hosts:
        - dutch.yourdomain.com
      secretName: nederlands-tutor-tls
  rules:
    - host: dutch.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nederlands-tutor-service
                port:
                  number: 80
