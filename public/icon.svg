<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dutchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <!-- Decorative border ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#dutchGrad)" stroke-width="6" opacity="0.8"/>
  <!-- Central speech bubble -->
  <g filter="url(#glow)">
    <path d="M140 160 C140 120, 372 120, 372 160 L372 280 C372 320, 300 320, 260 320 L200 370 L210 320 C140 320, 140 280, 140 240 Z" fill="#ffffff" opacity="0.96"/>
  </g>
  <!-- Dutch flag stripes inside bubble icon -->
  <path d="M180 180 Q256 165 332 180 L332 205 Q256 190 180 205 Z" fill="#ae1c28"/>
  <path d="M180 205 Q256 190 332 205 L332 230 Q256 215 180 230 Z" fill="#ffffff"/>
  <path d="M180 230 Q256 215 332 230 L332 255 Q256 240 180 255 Z" fill="#21468b"/>
  <!-- Soundwave / Speech icon badge -->
  <circle cx="360" cy="350" r="48" fill="#f97316"/>
  <path d="M346 338 L346 362 M355 330 L355 370 M364 322 L364 378 M373 332 L373 368" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
</svg>
